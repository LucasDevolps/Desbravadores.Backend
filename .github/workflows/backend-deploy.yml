name: Backend Deploy

on:
  push:
    branches: [develop]
    paths:
      - "backend/**"
      - "compose.yaml"
      - ".github/workflows/backend-deploy.yml"

jobs:
  deploy-linux:
    strategy:
      fail-fast: false
      matrix:
        # Um runner Linux por máquina de destino. Cada label é único (ver
        # config --labels na hora de registrar o runner), então o job roda
        # em paralelo em cada máquina a cada push em develop. Só inclua um
        # target aqui depois que o runner self-hosted correspondente estiver
        # registrado e online (repo > Settings > Actions > Runners) —
        # caso contrário o job fica preso na fila esperando um runner que
        # nunca aparece.
        target: [popos-lucas]

    concurrency:
      group: backend-deploy-${{ matrix.target }}
      cancel-in-progress: false

    # Runner self-hosted Linux com o label específico da máquina de destino
    runs-on: [self-hosted, Linux, "${{ matrix.target }}"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copiar .env fixo da máquina
        run: cp "$HOME/almirante/.env" "$GITHUB_WORKSPACE/.env"

      - name: Build e subir containers
        run: docker compose up -d --build

      # Quando o passo acima falha porque um container ficou unhealthy (ex.: API
      # derrubando na inicialização), o compose não mostra o motivo — só "dependency
      # failed to start". Sem este passo, a única forma de ver a exceção real seria
      # entrar na máquina do runner manualmente.
      - name: Logs da API em caso de falha ao subir
        if: failure()
        run: docker compose logs --no-color --tail=200 api

      # A aplicação roda as migrations pendentes automaticamente na
      # inicialização (Program.cs chama DbSeeder.SeedAsync antes de aceitar
      # tráfego). Esse passo espera o container subir e só reporta sucesso
      # quando a API responde, o que confirma que as migrations rodaram —
      # se falharem, o processo derruba a aplicação e o healthcheck nunca
      # fica verde. 60x3s (3min) porque migrations maiores (ex.: Cargos)
      # atrasam o start além do que 30x2s (1min) tolerava, derrubando o
      # deploy mesmo quando a app sobe normalmente logo em seguida.
      - name: Aguardar API ficar saudável (confirma que as migrations rodaram)
        run: |
          set -a
          source .env
          set +a
          port="${API_HOST_PORT:-8090}"
          for i in $(seq 1 60); do
            if curl -sf "http://localhost:${port}/health" > /dev/null; then
              echo "API saudável em http://localhost:${port}"
              exit 0
            fi
            sleep 3
          done
          echo "API não respondeu em tempo hábil." >&2
          docker compose logs --tail=100 api
          exit 1

      - name: Limpar imagens antigas
        if: always()
        run: docker image prune -f

  deploy-windows:
    concurrency:
      group: backend-deploy-windows
      cancel-in-progress: false

    # Runner self-hosted Windows (repo > Settings > Actions > Runners). "Windows"
    # precisa estar explícito aqui: como também existe um runner self-hosted
    # Linux registrado, "runs-on: self-hosted" sozinho seria ambíguo.
    runs-on: [self-hosted, Windows]

    env:
      SITE_PATH: C:\desbravadores\site
      PUBLISH_PATH: ${{ github.workspace }}\_publish

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish
        run: dotnet publish backend/Almirante.Api/Almirante.Api.csproj --configuration Release --output "${{ env.PUBLISH_PATH }}"

      # Liga o stdout log do ANCM (desligado por padrão). Se a aplicação
      # travar na inicialização (ex.: erro de migration ou de configuração),
      # o erro fica registrado aqui em vez de só um "não respondeu" sem
      # explicação — o passo de healthcheck imprime esse log se falhar.
      - name: Habilitar log de diagnóstico do ANCM
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "${{ env.PUBLISH_PATH }}\logs" -Force | Out-Null
          (Get-Content "${{ env.PUBLISH_PATH }}\web.config") -replace 'stdoutLogEnabled="false"', 'stdoutLogEnabled="true"' |
            Set-Content "${{ env.PUBLISH_PATH }}\web.config"

      # ANCM observa o app_offline.htm e derruba o processo em execução,
      # liberando os locks de arquivo, sem precisar de direitos de admin do
      # IIS para reciclar o app pool a partir do CI.
      - name: Tirar o site do ar
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "${{ env.SITE_PATH }}" -Force | Out-Null
          Set-Content -Path "${{ env.SITE_PATH }}\app_offline.htm" -Value "<html><body>Deploying...</body></html>"
          Start-Sleep -Seconds 5

      - name: Copiar os arquivos publicados para o site
        shell: pwsh
        run: |
          robocopy "${{ env.PUBLISH_PATH }}" "${{ env.SITE_PATH }}" /MIR /XF appsettings.Production.json app_offline.htm /NFL /NDL /NJH /NJS
          if ($LASTEXITCODE -ge 8) {
            throw "robocopy falhou com o código $LASTEXITCODE"
          }
          exit 0

      - name: Colocar o site no ar novamente
        shell: pwsh
        run: Remove-Item "${{ env.SITE_PATH }}\app_offline.htm" -ErrorAction SilentlyContinue

      # Em vez de chutar a porta do binding (já erramos duas vezes:
      # 7370 e 8080 — nenhuma respondeu, então o problema pode nem ser a
      # porta), pergunta pro próprio IIS qual porta o site que aponta para
      # SITE_PATH está usando.
      - name: Descobrir a porta do site no IIS
        id: site-port
        shell: pwsh
        run: |
          Import-Module WebAdministration -ErrorAction Stop
          $site = Get-Website | Where-Object { $_.PhysicalPath.TrimEnd('\') -eq "${{ env.SITE_PATH }}".TrimEnd('\') } | Select-Object -First 1
          if (-not $site) {
            Write-Error "Nenhum site do IIS encontrado com PhysicalPath = ${{ env.SITE_PATH }}. Sites existentes: $((Get-Website | Select-Object -ExpandProperty Name) -join ', ')"
            exit 1
          }
          $binding = Get-WebBinding -Name $site.Name | Select-Object -First 1
          if ($binding.bindingInformation -notmatch ':(\d+):') {
            Write-Error "Não consegui extrair a porta do binding '$($binding.bindingInformation)' do site '$($site.Name)'."
            exit 1
          }
          $port = $Matches[1]
          Write-Host "Site '$($site.Name)' encontrado (PhysicalPath: $($site.PhysicalPath)), porta $port"
          "port=$port" >> $env:GITHUB_OUTPUT

      # Espelha no Windows a proteção de rate limit de login que o Nginx já dá no Docker
      # Compose (deploy-linux). Não existe Docker aqui: o nginx roda nativo, só em
      # loopback (127.0.0.1:8090 -> 127.0.0.1:<porta do IIS>), na frente do site do IIS.
      # Idempotente: reaproveita a instalação existente em runs futuros, só baixando o
      # nginx na primeira vez.
      - name: Instalar Nginx (Windows), se ainda não existir
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\nginx\nginx.exe")) {
            $ProgressPreference = 'SilentlyContinue'
            $zipPath = "$env:TEMP\nginx.zip"
            Invoke-WebRequest -Uri "https://nginx.org/download/nginx-1.27.4.zip" -OutFile $zipPath
            $extractDir = "$env:TEMP\nginx-extract"
            Expand-Archive -Path $zipPath -DestinationPath $extractDir -Force
            $inner = Get-ChildItem $extractDir -Directory | Select-Object -First 1
            Move-Item -Path $inner.FullName -Destination "C:\nginx"
            Remove-Item $zipPath, $extractDir -Recurse -Force -ErrorAction SilentlyContinue
            Write-Host "Nginx instalado em C:\nginx"
          } else {
            Write-Host "Nginx já instalado em C:\nginx"
          }

      # nginx/nginx.windows.conf (versionado no repo) é a fonte da verdade; este passo só
      # substitui o placeholder da porta pela porta real descoberta acima e recarrega.
      - name: Publicar config do Nginx e (re)carregar
        shell: pwsh
        run: |
          $conf = Get-Content "nginx\nginx.windows.conf" -Raw
          $conf = $conf -replace '__IIS_PORT__', "${{ steps.site-port.outputs.port }}"
          Set-Content -Path "C:\nginx\conf\almirante.conf" -Value $conf -NoNewline

          Push-Location C:\nginx
          try {
            & .\nginx.exe -t
            if ($LASTEXITCODE -ne 0) { throw "nginx -t falhou (config inválida)" }

            $running = Get-Process nginx -ErrorAction SilentlyContinue
            if ($running) {
              & .\nginx.exe -s reload
              Write-Host "Nginx recarregado com a config atual."
            } else {
              Start-Process -FilePath "C:\nginx\nginx.exe" -WorkingDirectory "C:\nginx" -WindowStyle Hidden
              Write-Host "Nginx iniciado."
            }
          } finally {
            Pop-Location
          }

          if (-not (Get-ScheduledTask -TaskName "NginxAlmirante" -ErrorAction SilentlyContinue)) {
            $action = New-ScheduledTaskAction -Execute "C:\nginx\nginx.exe" -WorkingDirectory "C:\nginx"
            $trigger = New-ScheduledTaskTrigger -AtStartup
            $principal = New-ScheduledTaskPrincipal -UserId "SYSTEM" -LogonType ServiceAccount -RunLevel Highest
            $settings = New-ScheduledTaskSettingsSet -AllowStartIfOnBatteries -DontStopIfGoingOnBatteries -StartWhenAvailable -RestartCount 3 -RestartInterval (New-TimeSpan -Minutes 1)
            Register-ScheduledTask -TaskName "NginxAlmirante" -Action $action -Trigger $trigger -Principal $principal -Settings $settings -Description "Reverse proxy Nginx da API Almirante (rate limit de login), na frente do IIS." | Out-Null
            Write-Host "Tarefa agendada NginxAlmirante criada (inicia o nginx com o Windows)."
          }

      # ForwardedHeadersMiddleware (Program.cs) só confia em X-Forwarded-For/-Proto quando
      # ReverseProxy:TrustedNetworkCidr está configurado. appsettings.Production.json é
      # ignorado pelo robocopy acima (persiste entre deploys), então isso só precisa
      # acontecer uma vez — idempotente, não sobrescreve o resto do arquivo nem imprime
      # segredos no log.
      - name: Configurar confiança no proxy (ReverseProxy:TrustedNetworkCidr)
        shell: pwsh
        run: |
          $path = "${{ env.SITE_PATH }}\appsettings.Production.json"
          $json = Get-Content $path -Raw | ConvertFrom-Json
          if (-not $json.PSObject.Properties['ReverseProxy']) {
            $json | Add-Member -MemberType NoteProperty -Name 'ReverseProxy' -Value ([PSCustomObject]@{ TrustedNetworkCidr = "127.0.0.1/32" })
          } else {
            $json.ReverseProxy.TrustedNetworkCidr = "127.0.0.1/32"
          }
          $json | ConvertTo-Json -Depth 10 | Set-Content -Path $path -Encoding utf8
          Write-Host "ReverseProxy:TrustedNetworkCidr configurado em appsettings.Production.json."

      # A primeira requisição após remover o app_offline.htm faz o ANCM subir
      # um processo novo, que roda as migrations pendentes antes de aceitar
      # tráfego (Program.cs chama DbSeeder.SeedAsync no startup). Já tentamos
      # bloquear o job aqui esperando /health (2min, 5min, 15min) e continuou
      # dando falso-negativo: a API sempre subia saudável minutos depois do
      # job desistir, sem nenhum crash no meio — só a migration é lenta. Em
      # vez de brigar com o timeout, o job termina aqui e devolve a URL pro
      # dev conferir manualmente quando quiser.
      - name: Publicação concluída — verificar manualmente
        shell: pwsh
        run: |
          $uri = "http://127.0.0.1:8090/health"
          $agora = Get-Date -Format "dd/MM/yyyy HH:mm:ss"
          Write-Host "::notice::Consulte a URL $uri (via nginx, com rate limit de login) — a aplicação pode levar até 20 minutos para subir completamente. Deploy publicado às $agora."
