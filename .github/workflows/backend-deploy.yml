name: Backend Deploy

on:
  push:
    branches: [develop]
    paths:
      - "src/**"
      - "compose.yaml"
      - "compose.tls.yaml"
      - "compose.https.yaml"
      - "nginx/**"
      - "scripts/**"
      - "docs/sql/**"
      - ".github/workflows/backend-deploy.yml"

# Menor privilégio para o GITHUB_TOKEN: o deploy só precisa ler o repositório (o checkout).
# Nenhum step aqui cria release, comenta em PR nem escreve em pacotes.
permissions:
  contents: read

jobs:
  deploy-linux:
    strategy:
      fail-fast: false
      matrix:
        # Um runner Linux por máquina de destino. Cada label é único (ver
        # config --labels na hora de registrar o runner), então o job roda
        # em paralelo em cada máquina a cada push em develop. Só inclua um
        # target aqui depois que o runner self-hosted correspondente estiver
        # registrado e online (repo > Settings > Actions > Runners) —
        # caso contrário o job fica preso na fila esperando um runner que
        # nunca aparece.
        target: [popos-lucas]

    concurrency:
      group: backend-deploy-${{ matrix.target }}
      cancel-in-progress: false

    # Runner self-hosted Linux com o label específico da máquina de destino
    runs-on: [self-hosted, Linux, "${{ matrix.target }}"]

    steps:
      # Pinado por SHA (v4.2.2): tag é mutável e este job roda na máquina de deploy, com acesso ao
      # .env de produção e ao daemon Docker.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Copiar .env fixo da máquina
        run: cp "$HOME/almirante/.env" "$GITHUB_WORKSPACE/.env"

      # Escolhe explicitamente os overlays do Compose a partir de DEPLOY_MODE (definido no
      # .env fixo da máquina; ausente = "http", o comportamento de sempre). O .env é lido como DADO
      # por scripts/deploy-config.sh (mesma regra de dotenv do Compose; nunca "source"/"eval": um valor
      # com espaço, ";", "&" ou "$" não vira comando nem muda de significado). Falha aqui, antes de
      # qualquer alteração de serviço e sem fallback silencioso, se DEPLOY_MODE, NGINX_CONF_FILE,
      # TLS_PUBLIC_HOST, portas ou arquivos de certificado estiverem incoerentes. O mesmo valor
      # "files" é reusado em todos os passos abaixo (validação, subida, logs, healthcheck).
      - name: Selecionar modo de deploy (compose overlay)
        id: compose-mode
        run: bash scripts/deploy-config.sh modo .env "$GITHUB_OUTPUT"

      # Fotos de usuários (issue #116): pasta do host no usuário do runner, ao lado do .env fixo, criada aqui
      # (nada a preparar à mão na máquina). FOTOS_HOST_PATH faz o compose.yaml montá-la no lugar do volume.
      # O chmod só roda na criação: depois do próximo passo o dono passa a ser o "app" da imagem.
      - name: Definir pasta de fotos no host
        run: |
          pasta="$HOME/almirante/fotos"
          if [ ! -d "$pasta" ]; then
            mkdir -p "$pasta"
            chmod 700 "$pasta"
          fi
          echo "FOTOS_HOST_PATH=$pasta" >> "$GITHUB_ENV"
          echo "Pasta de fotos: $pasta"

      # Só o nome DNS validado de TLS_PUBLIC_HOST entra no arquivo montado pelo compose.tls.yaml; é ele
      # que define o único Host aceito pelo nginx e o destino canônico do redirect HTTP -> HTTPS.
      - name: Gerar host permitido do nginx (modo tls)
        if: steps.compose-mode.outputs.mode == 'tls'
        env:
          PUBLIC_HOST: ${{ steps.compose-mode.outputs.public_host }}
        run: bash scripts/deploy-config.sh gerar-host-tls nginx/generated/tls-host.conf "$PUBLIC_HOST"

      # Modo https (HTTPS local em 127.0.0.1:API_HTTPS_HOST_PORT, compose.https.yaml): o certificado fica fixo na
      # máquina, em $HOME/almirante/certs (ao lado do .env), e é copiado para nginx/certs, que o checkout limpa a
      # cada execução. Se faltar, ou vencer em menos de 30 dias, é gerado aqui como em docs/local-login.md
      # (autoassinado para localhost e 127.0.0.1): nada a preparar à mão na máquina.
      - name: Preparar certificado HTTPS local (modo https)
        if: steps.compose-mode.outputs.mode == 'https'
        run: |
          certs="$HOME/almirante/certs"
          if ! openssl x509 -checkend 2592000 -noout -in "$certs/localhost.pem" > /dev/null 2>&1 || [ ! -f "$certs/localhost.key" ]; then
            mkdir -p "$certs"
            chmod 700 "$certs"
            openssl req -x509 -newkey rsa:2048 -sha256 -days 825 -noenc \
              -keyout "$certs/localhost.key" -out "$certs/localhost.pem" \
              -subj '/CN=localhost' -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1' 2> /dev/null
            chmod 600 "$certs/localhost.key"
            echo "Certificado HTTPS local gerado em $certs (autoassinado, 825 dias)."
          fi
          mkdir -p nginx/certs
          cp "$certs/localhost.pem" "$certs/localhost.key" nginx/certs/
          echo "Certificado HTTPS local: $certs/localhost.pem (vence em $(openssl x509 -enddate -noout -in "$certs/localhost.pem" | cut -d= -f2))"

      - name: Validar configuração efetiva do Compose
        run: docker compose ${{ steps.compose-mode.outputs.files }} config --quiet

      # A API roda como "app" (não-root) e precisa gravar na pasta. Um container descartável da própria imagem,
      # sem dependências, ajusta o dono: root só com CAP_CHOWN (o serviço tem cap_drop ALL). Na primeira vez, fotos
      # que já estivessem no volume almirante-fotos são copiadas (como "app") para a pasta; o volume é mantido.
      - name: Ajustar dono da pasta de fotos (e migrar o volume antigo)
        env:
          FILES: ${{ steps.compose-mode.outputs.files }}
        run: |
          # --pull: sempre a última imagem base aspnet:10.0 (com os patches de segurança, ex.: CVE-2026-70159 no SignalR,
          # corrigida no 10.0.13), em vez da que estiver em cache no host. Se o pull falhar, o deploy para antes de trocar
          # os containers, e a versão em execução continua no ar.
          # shellcheck disable=SC2086
          docker compose $FILES build --pull api
          # shellcheck disable=SC2086
          docker compose $FILES run --rm -T --no-deps --user root --cap-add CHOWN --entrypoint chown api app:app /var/lib/almirante/fotos
          if docker volume inspect almirante-fotos > /dev/null 2>&1; then
            # shellcheck disable=SC2086
            docker compose $FILES run --rm -T --no-deps -v almirante-fotos:/origem:ro --entrypoint sh api -c \
              'if [ -z "$(ls -A /var/lib/almirante/fotos)" ] && [ -n "$(ls -A /origem)" ]; then cp -a /origem/. /var/lib/almirante/fotos/ && echo "Fotos do volume almirante-fotos copiadas para a pasta do host."; fi'
          fi

      - name: Build e subir containers
        run: docker compose ${{ steps.compose-mode.outputs.files }} up -d --build

      # Quando o passo acima falha porque um container ficou unhealthy (ex.: API
      # derrubando na inicialização), o compose não mostra o motivo — só "dependency
      # failed to start". Sem este passo, a única forma de ver a exceção real seria
      # entrar na máquina do runner manualmente.
      - name: Logs do bootstrap SQL e da API em caso de falha ao subir
        if: failure()
        run: docker compose ${{ steps.compose-mode.outputs.files }} logs --no-color --tail=200 sql-bootstrap api

      # A aplicação roda as migrations pendentes automaticamente na
      # inicialização (Program.cs chama DbSeeder.SeedAsync antes de aceitar
      # tráfego). Esse passo espera o container subir e só reporta sucesso
      # quando a API responde, o que confirma que as migrations rodaram —
      # se falharem, o processo derruba a aplicação e o healthcheck nunca
      # fica verde. 60x3s (3min) porque migrations maiores (ex.: Cargos)
      # atrasam o start além do que 30x2s (1min) tolerava, derrubando o
      # deploy mesmo quando a app sobe normalmente logo em seguida.
      - name: Aguardar API ficar saudável (confirma que as migrations rodaram)
        env:
          MODE: ${{ steps.compose-mode.outputs.mode }}
          PUBLIC_HOST: ${{ steps.compose-mode.outputs.public_host }}
          HOST_PORT: ${{ steps.compose-mode.outputs.port }}
          HTTPS_PORT: ${{ steps.compose-mode.outputs.https_port }}
        run: |
          if [ "$MODE" = "https" ]; then
            # Modo https: confere a porta HTTPS publicada, confiando só no certificado local (sem -k).
            url="https://localhost:${HTTPS_PORT}/health"
            curl_flags=(-fsS --cacert nginx/certs/localhost.pem)
          elif [ "$MODE" = "tls" ]; then
            # Modo TLS: exige a borda HTTPS pública de verdade (certificado válido para o
            # host, resposta final 200). Sem -k/--insecure — um certificado inválido deve
            # reprovar o deploy, não ser contornado. compose.tls.yaml publica só 443.
            # O certificado é emitido para o nome público, não para "localhost": usa esse nome na
            # URL (a verificação de identidade passa) e o --resolve o aponta para esta máquina.
            url="https://${PUBLIC_HOST}/health"
            curl_flags=(-fsS --resolve "${PUBLIC_HOST}:443:127.0.0.1")
          else
            url="http://localhost:${HOST_PORT}/health"
            curl_flags=(-sf)
          fi
          for i in $(seq 1 60); do
            if curl "${curl_flags[@]}" "$url" > /dev/null; then
              echo "API saudável em $url"
              exit 0
            fi
            sleep 3
          done
          echo "API não respondeu em tempo hábil em $url." >&2
          docker compose ${{ steps.compose-mode.outputs.files }} logs --tail=100 api
          exit 1

      # Console do Aspire (serviço aspire-dashboard do compose.yaml): confere que a interface responde no loopback e diz
      # onde achar o link de login. NUNCA imprime o token: o log do Actions é visível a quem lê o repositório. Falha aqui
      # só avisa: a API já está no ar e não depende do console.
      - name: Conferir o console do Aspire
        run: |
          for i in $(seq 1 20); do
            endereco=$(docker port almirante-aspire-dashboard 18888/tcp 2> /dev/null | head -1)
            if [ -n "$endereco" ] && [ "$(curl -s -o /dev/null -w '%{http_code}' "http://${endereco}/")" = "302" ]; then
              echo "::notice::Console do Aspire em http://${endereco} (só nesta máquina; de outra, ssh -L 18888:${endereco} <host>). Link com o token: docker logs almirante-aspire-dashboard 2>&1 | grep 'login?t='"
              exit 0
            fi
            sleep 3
          done
          echo "::warning::O console do Aspire não respondeu; a API não depende dele. Motivo: docker logs almirante-aspire-dashboard"

      - name: Limpar imagens antigas
        if: always()
        run: docker image prune -f

  deploy-windows:
    concurrency:
      group: backend-deploy-windows
      cancel-in-progress: false

    # Runner self-hosted Windows (repo > Settings > Actions > Runners). "Windows"
    # precisa estar explícito aqui: como também existe um runner self-hosted
    # Linux registrado, "runs-on: self-hosted" sozinho seria ambíguo.
    runs-on: [self-hosted, Windows]

    env:
      SITE_PATH: C:\desbravadores\site
      PUBLISH_PATH: ${{ github.workspace }}\_publish

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      # win-x64: só os binários nativos do Windows x64 (o Skia das fotos traz os de todas as plataformas).
      - name: Publish
        run: dotnet publish src/Almirante.Api/Almirante.Api.csproj --configuration Release --runtime win-x64 --self-contained false --output "${{ env.PUBLISH_PATH }}"

      # Liga o stdout log do ANCM (desligado por padrão). Se a aplicação
      # travar na inicialização (ex.: erro de migration ou de configuração),
      # o erro fica registrado aqui em vez de só um "não respondeu" sem
      # explicação — o passo de healthcheck imprime esse log se falhar.
      - name: Habilitar log de diagnóstico do ANCM
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "${{ env.PUBLISH_PATH }}\logs" -Force | Out-Null
          (Get-Content "${{ env.PUBLISH_PATH }}\web.config") -replace 'stdoutLogEnabled="false"', 'stdoutLogEnabled="true"' |
            Set-Content "${{ env.PUBLISH_PATH }}\web.config"

      # Preflight (nada aqui altera o site): tudo que pode falhar por configuração do host é conferido
      # ANTES de "Tirar o site do ar", para uma falha não deixar o site IIS offline por causa de
      # arquivo/TLS/porta incoerentes.
      - name: Validar appsettings.Production.json existente
        shell: pwsh
        run: |
          $path = "${{ env.SITE_PATH }}\appsettings.Production.json"
          if (-not (Test-Path $path)) {
            Write-Error "Não existe $path (configuração persistente do ambiente). Crie-o antes do deploy; nada foi alterado."
            exit 1
          }
          try { Get-Content $path -Raw | ConvertFrom-Json | Out-Null } catch {
            Write-Error "$path não é um JSON válido; nada foi alterado."
            exit 1
          }


      # Em vez de chutar a porta do binding (já erramos duas vezes:
      # 7370 e 8080 — nenhuma respondeu, então o problema pode nem ser a
      # porta), pergunta pro próprio IIS qual porta o site que aponta para
      # SITE_PATH está usando.
      - name: Descobrir a porta do site no IIS
        id: site-port
        shell: pwsh
        run: |
          Import-Module WebAdministration -ErrorAction Stop
          $site = Get-Website | Where-Object { $_.PhysicalPath.TrimEnd('\') -eq "${{ env.SITE_PATH }}".TrimEnd('\') } | Select-Object -First 1
          if (-not $site) {
            Write-Error "Nenhum site do IIS encontrado com PhysicalPath = ${{ env.SITE_PATH }}. Sites existentes: $((Get-Website | Select-Object -ExpandProperty Name) -join ', ')"
            exit 1
          }
          $binding = Get-WebBinding -Name $site.Name | Select-Object -First 1
          if ($binding.bindingInformation -notmatch ':(\d+):') {
            Write-Error "Não consegui extrair a porta do binding '$($binding.bindingInformation)' do site '$($site.Name)'."
            exit 1
          }
          $port = $Matches[1]
          Write-Host "Site '$($site.Name)' encontrado (PhysicalPath: $($site.PhysicalPath)), porta $port"
          "port=$port" >> $env:GITHUB_OUTPUT

      # nginx/nginx.windows.conf (versionado no repo) é HTTP-only por design (loopback,
      # nunca exposto à internet — ver o próprio arquivo). Se este host algum dia ganhar TLS
      # configurado manualmente (fora do repo, ex.: um listener 443/ssl adicionado à mão em
      # C:\nginx\conf\almirante.conf), o passo abaixo pararia e sobrescreveria com HTTP a
      # cada deploy. Este guard aborta em vez de sobrescrever nesse caso — não decide por
      # conta própria como reconciliar; só evita apagar silenciosamente.
      - name: Verificar se a config atual do Nginx já tem TLS configurado manualmente
        shell: pwsh
        run: |
          $path = "C:\nginx\conf\almirante.conf"
          if (Test-Path $path) {
            $atual = Get-Content $path -Raw
            if ($atual -match '(?im)^\s*listen\s+.*\b443\b' -or $atual -match '(?im)^\s*ssl_certificate\b') {
              Write-Error "C:\nginx\conf\almirante.conf já tem um listener TLS/443 que não vem de nginx/nginx.windows.conf (que é HTTP-only por design). Abortando para não sobrescrever uma configuração TLS manual deste host. Se essa config TLS não for mais necessária, remova-a manualmente antes de rodar o deploy de novo."
              exit 1
            }
          }

      # Fotos de usuários (issue #116): a pasta fica FORA do site (o robocopy /MIR abaixo apagaria o que estivesse
      # dentro) e é informada ao app pool por Media__Storage__Path. Sem a variável, o deploy usa a pasta "fotos" ao
      # lado do site e a define no pool; sem a pasta, cria-a com a ACL do README ("Docker/Nginx no Windows (IIS)"):
      # só o pool lê, grava e apaga, herança desligada só na raiz (nunca /T). Uma pasta já existente mantém a ACL do
      # operador. Roda ANTES de tirar o site do ar; definir a variável recicla o pool, que volta já com a pasta.
      - name: Preparar pasta de fotos do app pool (Media__Storage__Path)
        shell: pwsh
        run: |
          Import-Module WebAdministration -ErrorAction Stop
          $site = Get-Website | Where-Object { $_.PhysicalPath.TrimEnd('\') -eq "${{ env.SITE_PATH }}".TrimEnd('\') } | Select-Object -First 1
          $pool = $site.applicationPool
          $filtro = "system.applicationHost/applicationPools/add[@name='$pool']/environmentVariables"
          $pasta = (Get-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT/APPHOST' -Filter $filtro -Name Collection |
            Where-Object { $_.name -eq 'Media__Storage__Path' } | Select-Object -First 1).value
          $definida = -not [string]::IsNullOrWhiteSpace($pasta)
          if (-not $definida) {
            $pasta = Join-Path (Split-Path "${{ env.SITE_PATH }}".TrimEnd('\') -Parent) 'fotos'
          }
          $completa = [System.IO.Path]::GetFullPath($pasta).TrimEnd('\') + '\'
          $siteCompleto = [System.IO.Path]::GetFullPath("${{ env.SITE_PATH }}").TrimEnd('\') + '\'
          if ($completa.StartsWith($siteCompleto, [StringComparison]::OrdinalIgnoreCase) -or $siteCompleto.StartsWith($completa, [StringComparison]::OrdinalIgnoreCase)) {
            Write-Error "Media__Storage__Path ($pasta) não pode ficar dentro do site nem contê-lo: o deploy apagaria as fotos. Nada foi alterado."
            exit 1
          }
          if (-not (Test-Path $pasta -PathType Container)) {
            New-Item -ItemType Directory -Path $pasta -Force | Out-Null
            icacls $pasta /inheritance:r /grant:r "IIS AppPool\${pool}:(OI)(CI)(R,W,D)" '*S-1-5-18:(OI)(CI)F' '*S-1-5-32-544:(OI)(CI)F' /Q | Out-Null
            if ($LASTEXITCODE -ne 0) {
              Write-Error "Não foi possível aplicar a ACL em $pasta (icacls saiu com $LASTEXITCODE). O site continua no ar."
              exit 1
            }
            Write-Host "Pasta de fotos criada com a ACL do app pool '$pool': $pasta"
          }
          if (-not $definida) {
            Add-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT/APPHOST' -Filter $filtro -Name '.' `
              -Value @{ name = 'Media__Storage__Path'; value = $pasta }
            Write-Host "Media__Storage__Path definido no app pool '$pool': $pasta"
          }
          Write-Host "Pasta de fotos conferida: $pasta"

      # No IIS a API usa o runtime compartilhado instalado na máquina (Hosting Bundle), não o da imagem Docker. 10.0.13 é o
      # mínimo: corrige a CVE-2026-70159 (negação de serviço no SignalR, usado pelo hub de notificações). Roda antes de tirar
      # o site do ar; sem o runtime, o deploy para e a versão em execução continua no ar.
      - name: Conferir runtime mínimo do ASP.NET Core
        shell: pwsh
        run: |
          $minimo = [version]'10.0.13'
          $instalados = dotnet --list-runtimes | Where-Object { $_ -match '^Microsoft\.AspNetCore\.App (10\.\d+\.\d+) ' } |
            ForEach-Object { [version]($_ -replace '^Microsoft\.AspNetCore\.App (\S+) .*$', '$1') }
          $maior = $instalados | Sort-Object -Descending | Select-Object -First 1
          if (-not $maior -or $maior -lt $minimo) {
            Write-Error "ASP.NET Core Runtime 10.0 instalado: $(if ($maior) { $maior } else { 'nenhum' }); mínimo $minimo. Instale o Hosting Bundle mais recente do .NET 10 (https://dotnet.microsoft.com/download/dotnet/10.0) e rode o deploy de novo. O site não foi alterado."
            exit 1
          }
          Write-Host "ASP.NET Core Runtime $maior (mínimo $minimo)."

      # Hub SignalR de notificações (issue #130, docs/notificacoes.md). O transporte WebSocket passa pelo IIS só com o
      # recurso "WebSocket Protocol"; sem ele o cliente cai para long polling. O handshake WebSocket do navegador leva o
      # access_token na query, então o log W3C do site não grava a query (UriQuery). Idempotente. O pool só é reiniciado
      # quando o recurso acabou de ser instalado, e sempre parando antes de iniciar (nunca dois workers ao mesmo tempo:
      # cada inicialização rotaciona a senha SQL de runtime).
      - name: Garantir WebSocket no IIS e log sem query string
        shell: pwsh
        run: |
          Import-Module WebAdministration -ErrorAction Stop
          $site = Get-Website | Where-Object { $_.PhysicalPath.TrimEnd('\') -eq "${{ env.SITE_PATH }}".TrimEnd('\') } | Select-Object -First 1
          $instalado = $false
          if ((Get-WindowsOptionalFeature -Online -FeatureName IIS-WebSockets).State -ne 'Enabled') {
            Enable-WindowsOptionalFeature -Online -FeatureName IIS-WebSockets -All -NoRestart | Out-Null
            $instalado = $true
            Write-Host "Recurso IIS-WebSockets instalado."
          }
          $filtro = "system.applicationHost/sites/site[@name='$($site.name)']/logFile"
          $campos = "$(Get-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT/APPHOST' -Filter $filtro -Name logExtFileFlags)"
          $semQuery = ($campos -split ',' | ForEach-Object { $_.Trim() } | Where-Object { $_ -and $_ -ne 'UriQuery' }) -join ','
          if ($semQuery -ne $campos) {
            Set-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT/APPHOST' -Filter $filtro -Name logExtFileFlags -Value $semQuery
            Write-Host "UriQuery removido do log W3C do site $($site.name)."
          }
          if ($instalado) {
            $pool = $site.applicationPool
            if ((Get-WebAppPoolState -Name $pool).Value -ne 'Stopped') { Stop-WebAppPool -Name $pool }
            $limite = (Get-Date).AddSeconds(60)
            while ((Get-WebAppPoolState -Name $pool).Value -ne 'Stopped' -and (Get-Date) -lt $limite) { Start-Sleep -Milliseconds 500 }
            Start-WebAppPool -Name $pool
            Write-Host "App pool '$pool' reiniciado para carregar o módulo de WebSocket."
          }
          Write-Host "WebSocket do IIS e log sem query conferidos."

      # Console do Aspire (dashboard standalone, sem Docker): binários do pacote NuGet Aspire.Dashboard.Sdk.win-x64, com o
      # SHA256 conferido ANTES de extrair (ao subir de versão, troque versão e hash juntos; mesma versão da imagem do
      # compose.yaml). Fica em C:\desbravadores\aspire-dashboard e roda pela tarefa AspireDashboardAlmirante como LOCAL
      # SERVICE (não SYSTEM), só em 127.0.0.1: interface na 18888, OTLP na 18889. O token de login é gerado uma vez em
      # browser-token.txt e nunca impresso; a pasta é legível só por administradores, SYSTEM e LOCAL SERVICE (herança
      # desligada só na raiz, nunca /T). Roda antes de tirar o site do ar, e qualquer falha aqui só avisa: o console nunca
      # bloqueia nem derruba o deploy da API.
      - name: Instalar e (re)iniciar o console do Aspire
        shell: pwsh
        env:
          DASHBOARD_VERSION: 13.5.2
          DASHBOARD_SHA256: 75a7d51c50816d751c8551d93774bbdb5c2dc578832cee46ad175c8a5c289632
        run: |
          $raiz = 'C:\desbravadores\aspire-dashboard'
          $tarefa = 'AspireDashboardAlmirante'
          try {
            if (-not (Test-Path $raiz)) {
              New-Item -ItemType Directory -Path $raiz | Out-Null
              icacls $raiz /inheritance:r /grant:r '*S-1-5-18:(OI)(CI)F' '*S-1-5-32-544:(OI)(CI)F' '*S-1-5-19:(OI)(CI)RX' /Q | Out-Null
              if ($LASTEXITCODE -ne 0) { throw "icacls saiu com $LASTEXITCODE em $raiz" }
            }
            $logs = Join-Path $raiz 'logs'
            if (-not (Test-Path $logs)) {
              New-Item -ItemType Directory -Path $logs | Out-Null
              icacls $logs /grant:r '*S-1-5-19:(OI)(CI)M' /Q | Out-Null
              if ($LASTEXITCODE -ne 0) { throw "icacls saiu com $LASTEXITCODE em $logs" }
            }
            $token = Join-Path $raiz 'browser-token.txt'
            if (-not (Test-Path $token)) {
              Set-Content -LiteralPath $token -Value ([Convert]::ToHexStringLower([System.Security.Cryptography.RandomNumberGenerator]::GetBytes(32))) -NoNewline
              Write-Host "Token de login do console gerado em $token."
            }

            # Para o console antes de trocar binários ou o script de início (o executável fica travado enquanto roda).
            if (Get-ScheduledTask -TaskName $tarefa -ErrorAction SilentlyContinue) { Stop-ScheduledTask -TaskName $tarefa }
            Get-Process Aspire.Dashboard -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "$raiz\*" } | Stop-Process -Force

            $bin = Join-Path $raiz 'bin'
            $versao = Join-Path $bin 'versao.txt'
            if (-not (Test-Path $versao) -or (Get-Content $versao -Raw).Trim() -ne $env:DASHBOARD_VERSION) {
              $ProgressPreference = 'SilentlyContinue'
              # Baixado e extraído dentro da raiz, para herdar a ACL dela (um Move-Item de outra pasta manteria a ACL de origem).
              $pacote = Join-Path $raiz 'pacote.zip'
              $extraido = Join-Path $raiz 'pacote'
              Invoke-WebRequest -Uri "https://api.nuget.org/v3-flatcontainer/aspire.dashboard.sdk.win-x64/$($env:DASHBOARD_VERSION)/aspire.dashboard.sdk.win-x64.$($env:DASHBOARD_VERSION).nupkg" -OutFile $pacote
              $hash = (Get-FileHash -Path $pacote -Algorithm SHA256).Hash
              if ($hash -ne $env:DASHBOARD_SHA256.ToUpperInvariant()) {
                Remove-Item $pacote -Force -ErrorAction SilentlyContinue
                throw "SHA256 do pacote do console não confere (esperado $($env:DASHBOARD_SHA256), obtido $hash); nada foi instalado"
              }
              Remove-Item $extraido -Recurse -Force -ErrorAction SilentlyContinue
              Expand-Archive -Path $pacote -DestinationPath $extraido -Force
              Remove-Item $bin -Recurse -Force -ErrorAction SilentlyContinue
              Move-Item (Join-Path $extraido 'tools') $bin
              Set-Content -LiteralPath $versao -Value $env:DASHBOARD_VERSION -NoNewline
              Remove-Item $pacote, $extraido -Recurse -Force -ErrorAction SilentlyContinue
              Write-Host "Console do Aspire $($env:DASHBOARD_VERSION) instalado em $bin (SHA256 conferido)."
            }
            Copy-Item 'scripts\windows\iniciar-aspire-dashboard.ps1' (Join-Path $raiz 'iniciar-aspire-dashboard.ps1') -Force

            $pwsh = (Get-Command pwsh -ErrorAction Stop).Source
            $action = New-ScheduledTaskAction -Execute $pwsh -Argument "-NoProfile -NonInteractive -File `"$raiz\iniciar-aspire-dashboard.ps1`"" -WorkingDirectory $raiz
            $trigger = New-ScheduledTaskTrigger -AtStartup
            $principal = New-ScheduledTaskPrincipal -UserId 'NT AUTHORITY\LOCAL SERVICE' -LogonType ServiceAccount
            # Sem limite de execução (o padrão de 72 h encerraria o console) e reinício automático se ele cair.
            $settings = New-ScheduledTaskSettingsSet -AllowStartIfOnBatteries -DontStopIfGoingOnBatteries -StartWhenAvailable `
              -ExecutionTimeLimit ([TimeSpan]::Zero) -RestartCount 3 -RestartInterval (New-TimeSpan -Minutes 1) -MultipleInstances IgnoreNew
            Register-ScheduledTask -TaskName $tarefa -Action $action -Trigger $trigger -Principal $principal -Settings $settings -Force `
              -Description 'Console do Aspire (dashboard standalone) da API Almirante: telemetria em 127.0.0.1:18888.' | Out-Null
            Start-ScheduledTask -TaskName $tarefa

            $limite = (Get-Date).AddSeconds(60)
            do {
              Start-Sleep -Seconds 2
              $noAr = Get-NetTCPConnection -LocalAddress 127.0.0.1 -LocalPort 18888 -State Listen -ErrorAction SilentlyContinue
            } while (-not $noAr -and (Get-Date) -lt $limite)
            if (-not $noAr) { throw "o console não passou a escutar em 127.0.0.1:18888 em 60 s (veja $logs\dashboard.log)" }
            Write-Host "Console do Aspire no ar em http://127.0.0.1:18888."
          } catch {
            Write-Host "::warning::Console do Aspire não atualizado: $($_.Exception.Message). O deploy da API segue; ela não depende do console."
          }
          exit 0

      # ANCM observa o app_offline.htm e derruba o processo em execução,
      # liberando os locks de arquivo, sem precisar de direitos de admin do
      # IIS para reciclar o app pool a partir do CI.
      - name: Tirar o site do ar
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "${{ env.SITE_PATH }}" -Force | Out-Null
          Set-Content -Path "${{ env.SITE_PATH }}\app_offline.htm" -Value "<html><body>Deploying...</body></html>"
          Start-Sleep -Seconds 5

      - name: Copiar os arquivos publicados para o site
        shell: pwsh
        run: |
          robocopy "${{ env.PUBLISH_PATH }}" "${{ env.SITE_PATH }}" /MIR /XF appsettings.Production.json app_offline.htm /NFL /NDL /NJH /NJS
          if ($LASTEXITCODE -ge 8) {
            throw "robocopy falhou com o código $LASTEXITCODE"
          }
          exit 0

      # ForwardedHeadersMiddleware (Program.cs) só confia em X-Forwarded-For/-Proto quando
      # ReverseProxy:TrustedNetworkCidr está configurado, e o ASP.NET só rejeita Host desconhecido quando
      # AllowedHosts não é "*". appsettings.Production.json é ignorado pelo robocopy (persiste entre
      # deploys). Roda com o site ainda OFFLINE (app_offline.htm), antes de ele voltar ao ar, para o
      # processo já subir com a configuração final. Idempotente; não sobrescreve o resto do arquivo nem
      # imprime segredos. AllowedHosts só é definido quando ausente ou "*" (um valor já ajustado pelo
      # operador é preservado): loopback e o nome desta máquina.
      - name: Configurar proxy confiável e hosts permitidos (appsettings.Production.json)
        shell: pwsh
        run: |
          $path = "${{ env.SITE_PATH }}\appsettings.Production.json"
          $json = Get-Content $path -Raw | ConvertFrom-Json
          if (-not $json.PSObject.Properties['ReverseProxy']) {
            $json | Add-Member -MemberType NoteProperty -Name 'ReverseProxy' -Value ([PSCustomObject]@{ TrustedNetworkCidr = "127.0.0.1/32" })
          } else {
            $json.ReverseProxy.TrustedNetworkCidr = "127.0.0.1/32"
          }
          $hosts = "localhost;127.0.0.1;[::1];$($env:COMPUTERNAME.ToLowerInvariant())"
          if (-not $json.PSObject.Properties['AllowedHosts']) {
            $json | Add-Member -MemberType NoteProperty -Name 'AllowedHosts' -Value $hosts
          } elseif ([string]::IsNullOrWhiteSpace($json.AllowedHosts) -or $json.AllowedHosts.Trim() -eq '*') {
            $json.AllowedHosts = $hosts
          }
          $json | ConvertTo-Json -Depth 10 | Set-Content -Path $path -Encoding utf8
          Write-Host "ReverseProxy:TrustedNetworkCidr e AllowedHosts configurados em appsettings.Production.json."

      # Telemetria da API para o console do Aspire (passo "Instalar e (re)iniciar o console do Aspire"), pelas variáveis do
      # app pool. Só cria as que faltam: um valor já ajustado pelo operador é preservado. Roda com o site ainda OFFLINE: a
      # mudança recicla o pool, e o processo novo só sobe quando o app_offline.htm sai (nunca dois workers ao mesmo tempo,
      # cada inicialização rotaciona a senha SQL de runtime). Com o console fora do ar, a exportação falha em silêncio.
      - name: Apontar a telemetria do app pool para o console do Aspire
        shell: pwsh
        run: |
          Import-Module WebAdministration -ErrorAction Stop
          $site = Get-Website | Where-Object { $_.PhysicalPath.TrimEnd('\') -eq "${{ env.SITE_PATH }}".TrimEnd('\') } | Select-Object -First 1
          $pool = $site.applicationPool
          $filtro = "system.applicationHost/applicationPools/add[@name='$pool']/environmentVariables"
          $atuais = Get-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT/APPHOST' -Filter $filtro -Name Collection
          foreach ($variavel in @(@{ name = 'OTEL_EXPORTER_OTLP_ENDPOINT'; value = 'http://127.0.0.1:18889' }, @{ name = 'OTEL_SERVICE_NAME'; value = 'almirante-api' })) {
            if (-not ($atuais | Where-Object { $_.name -eq $variavel.name })) {
              Add-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT/APPHOST' -Filter $filtro -Name '.' -Value $variavel
              Write-Host "$($variavel.name) definido no app pool '$pool'."
            }
          }
          Write-Host "Telemetria do app pool '$pool' conferida."


      - name: Colocar o site no ar novamente
        shell: pwsh
        run: Remove-Item "${{ env.SITE_PATH }}\app_offline.htm" -ErrorAction SilentlyContinue

      # Espelha no Windows a proteção de rate limit de login que o Nginx já dá no Docker
      # Compose (deploy-linux). Não existe Docker aqui: o nginx roda nativo, só em
      # loopback (127.0.0.1:8090 -> 127.0.0.1:<porta do IIS>), na frente do site do IIS.
      # Idempotente: reaproveita a instalação existente em runs futuros, só baixando o
      # nginx na primeira vez.
      # O binário é baixado da internet e passa a rodar neste host (tarefa agendada, ver abaixo):
      # o SHA256 é verificado ANTES de extrair/mover. Sem isso, um comprometimento de nginx.org
      # (ou do caminho até ele) instalaria um executável arbitrário na máquina de deploy.
      # Ao subir de versão, troque URL e hash juntos — o hash publicado está em
      # https://nginx.org/en/download.html (arquivo .zip do Windows correspondente).
      - name: Instalar Nginx (Windows), se ainda não existir
        shell: pwsh
        env:
          NGINX_URL: https://nginx.org/download/nginx-1.27.4.zip
          NGINX_SHA256: 203424f33554ae4b915e08e70ae5ff28ff5696b6a8ac9d57127fca1f1c6ff360
        run: |
          if (-not (Test-Path "C:\nginx\nginx.exe")) {
            $ProgressPreference = 'SilentlyContinue'
            $zipPath = "$env:TEMP\nginx.zip"
            Invoke-WebRequest -Uri $env:NGINX_URL -OutFile $zipPath

            $hash = (Get-FileHash -Path $zipPath -Algorithm SHA256).Hash
            if ($hash -ne $env:NGINX_SHA256.ToUpperInvariant()) {
              Remove-Item $zipPath -Force -ErrorAction SilentlyContinue
              Write-Error "SHA256 do pacote do Nginx nao confere (esperado $($env:NGINX_SHA256), obtido $hash). Nada foi instalado."
              exit 1
            }
            Write-Host "SHA256 do pacote do Nginx conferido."

            $extractDir = "$env:TEMP\nginx-extract"
            Expand-Archive -Path $zipPath -DestinationPath $extractDir -Force
            $inner = Get-ChildItem $extractDir -Directory | Select-Object -First 1
            Move-Item -Path $inner.FullName -Destination "C:\nginx"
            Remove-Item $zipPath, $extractDir -Recurse -Force -ErrorAction SilentlyContinue
            Write-Host "Nginx instalado em C:\nginx"
          } else {
            Write-Host "Nginx já instalado em C:\nginx"
          }

      # nginx/nginx.windows.conf (versionado no repo) é a fonte da verdade; este passo só
      # substitui o placeholder da porta pela porta real descoberta acima e recarrega.
      - name: Publicar config do Nginx e (re)carregar
        shell: pwsh
        run: |
          $conf = Get-Content "nginx\nginx.windows.conf" -Raw
          $conf = $conf -replace '__IIS_PORT__', "${{ steps.site-port.outputs.port }}"
          Set-Content -Path "C:\nginx\conf\almirante.conf" -Value $conf -NoNewline

          Push-Location C:\nginx
          try {
            & .\nginx.exe -t
            if ($LASTEXITCODE -ne 0) { throw "nginx -t falhou (config inválida)" }

            $running = Get-Process nginx -ErrorAction SilentlyContinue
            if ($running) {
              & .\nginx.exe -s reload
              Write-Host "Nginx recarregado com a config atual."
            } else {
              Start-Process -FilePath "C:\nginx\nginx.exe" -WorkingDirectory "C:\nginx" -WindowStyle Hidden
              Write-Host "Nginx iniciado."
            }
          } finally {
            Pop-Location
          }

          # RISCO RESIDUAL CONHECIDO (não corrigido aqui de propósito): a tarefa roda o nginx como
          # SYSTEM. Um reverse proxy não precisa disso — ele só escuta 127.0.0.1:8090, porta não
          # privilegiada. Trocar o principal por uma conta de serviço dedicada exige criar a conta e
          # ajustar a ACL de C:\nginx (logs/temp) NESTE host; feito às cegas pelo workflow, o nginx
          # simplesmente não sobe no próximo boot. Além disso este bloco só cria a tarefa quando ela
          # ainda não existe, então a troca não se aplicaria ao host atual de qualquer forma.
          # Ação do operador: criar a conta de serviço, dar a ela escrita em C:\nginx\logs e temp,
          # remover a tarefa atual e deixar este passo recriá-la — e restringir a ACL de
          # C:\nginx\nginx.exe para que a conta do runner não possa substituir o executável.
          if (-not (Get-ScheduledTask -TaskName "NginxAlmirante" -ErrorAction SilentlyContinue)) {
            $action = New-ScheduledTaskAction -Execute "C:\nginx\nginx.exe" -WorkingDirectory "C:\nginx"
            $trigger = New-ScheduledTaskTrigger -AtStartup
            $principal = New-ScheduledTaskPrincipal -UserId "SYSTEM" -LogonType ServiceAccount -RunLevel Highest
            $settings = New-ScheduledTaskSettingsSet -AllowStartIfOnBatteries -DontStopIfGoingOnBatteries -StartWhenAvailable -RestartCount 3 -RestartInterval (New-TimeSpan -Minutes 1)
            Register-ScheduledTask -TaskName "NginxAlmirante" -Action $action -Trigger $trigger -Principal $principal -Settings $settings -Description "Reverse proxy Nginx da API Almirante (rate limit de login), na frente do IIS." | Out-Null
            Write-Host "Tarefa agendada NginxAlmirante criada (inicia o nginx com o Windows)."
          }

      # A primeira requisição após remover o app_offline.htm faz o ANCM subir
      # um processo novo, que roda as migrations pendentes antes de aceitar
      # tráfego (Program.cs chama DbSeeder.SeedAsync no startup). Já tentamos
      # bloquear o job aqui esperando /health (2min, 5min, 15min) e continuou
      # dando falso-negativo: a API sempre subia saudável minutos depois do
      # job desistir, sem nenhum crash no meio — só a migration é lenta. Em
      # vez de brigar com o timeout, o job termina aqui e devolve a URL pro
      # dev conferir manualmente quando quiser.
      - name: Publicação concluída — verificar manualmente
        shell: pwsh
        run: |
          $uri = "http://127.0.0.1:8090/health"
          $agora = Get-Date -Format "dd/MM/yyyy HH:mm:ss"
          Write-Host "::notice::Consulte a URL $uri (via nginx, com rate limit de login) — a aplicação pode levar até 20 minutos para subir completamente. Deploy publicado às $agora."
          Write-Host "::notice::Console do Aspire: http://127.0.0.1:18888/login?t=<token>, com o token de C:\desbravadores\aspire-dashboard\browser-token.txt (só administradores)."
