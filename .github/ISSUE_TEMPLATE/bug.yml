name: Relatar bug
description: Informe um comportamento incorreto da API ou da infraestrutura do projeto.
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por reportar. **Não inclua senhas, tokens, cookies, chaves, connection strings ou outros segredos.**
        Se o problema for uma vulnerabilidade de segurança explorável, não abra esta issue: siga o `SECURITY.md`.

  - type: textarea
    id: descricao
    attributes:
      label: Descrição do problema
      description: O que está acontecendo de errado?
    validations:
      required: true

  - type: textarea
    id: reproducao
    attributes:
      label: Passos para reproduzir
      description: Sequência mínima para reproduzir o problema (endpoint, payload fictício, cargo do usuário, configuração).
      placeholder: |
        1. Autenticar como usuário com cargo ...
        2. Enviar POST /api/... com o corpo ...
        3. Observar a resposta ...
    validations:
      required: true

  - type: textarea
    id: esperado
    attributes:
      label: Comportamento esperado
    validations:
      required: true

  - type: textarea
    id: observado
    attributes:
      label: Comportamento observado
      description: Inclua status HTTP e mensagem de erro, se houver.
    validations:
      required: true

  - type: dropdown
    id: ambiente
    attributes:
      label: Ambiente
      options:
        - Docker Compose local
        - .NET Aspire local
        - Ambiente publicado
        - CI (GitHub Actions)
        - Outro / não sei
    validations:
      required: true

  - type: input
    id: versao
    attributes:
      label: Branch ou commit
      description: "Opcional. Ex.: develop, main ou o SHA do commit."
    validations:
      required: false

  - type: textarea
    id: evidencias
    attributes:
      label: Logs e evidências (sanitizados)
      description: Remova ou mascare qualquer dado sensível antes de colar.
      render: text
    validations:
      required: false

  - type: textarea
    id: impacto
    attributes:
      label: Impacto
      description: Quem é afetado e com que gravidade? Existe contorno?
    validations:
      required: false
