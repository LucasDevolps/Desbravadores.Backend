name: almirante

# Rede dedicada com subnet fixa e IP fixo para o nginx: a API (ReverseProxy__TrustedNetworkCidr, ver
# api.environment) confia nos headers X-Forwarded-For/X-Forwarded-Proto SOMENTE vindos do nginx
# (/32), não de qualquer container da rede nem do gateway (o host Docker). Se a subnet padrão
# conflitar com outra rede da máquina, ajuste ALMIRANTE_SUBNET, NGINX_IPV4 e API_TRUSTED_PROXY_CIDR
# juntos no .env.
networks:
  almirante-net:
    name: ${ALMIRANTE_NETWORK_NAME:-almirante-net}
    driver: bridge
    ipam:
      config:
        - subnet: ${ALMIRANTE_SUBNET:-172.30.0.0/24}

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: almirante-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:?defina SQL_SA_PASSWORD no arquivo .env}
      MSSQL_PID: Developer
    ports:
      - "${SQL_HOST_PORT:-14330}:1433"
    networks:
      - almirante-net
    volumes:
      # Volume nomeado e persistente: pode ser exportado (docker volume + docker run --rm -v ...)
      # e restaurado em outra máquina para compartilhar backups/estado atual do banco.
      - almirante-sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Almirante.Api/Dockerfile
    container_name: almirante-api
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__almirante: Server=sqlserver,1433;Database=almirante;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True
      Jwt__Issuer: ${JWT_ISSUER:-Almirante.Api}
      Jwt__Audience: ${JWT_AUDIENCE:-Almirante.Frontend}
      Jwt__ActiveKeyId: ${JWT_ACTIVE_KEY_ID:-v1}
      Jwt__Keys__v1: ${JWT_KEY_V1:?defina JWT_KEY_V1 Base64 no arquivo .env}
      Jwt__AccessTokenMinutes: ${JWT_ACCESS_TOKEN_MINUTES:-10}
      Jwt__AbsoluteSessionDays: ${AUTH_SESSION_DAYS:-7}
      Jwt__RefreshInactivityHours: ${AUTH_REFRESH_INACTIVITY_HOURS:-24}
      SeedAdmin__Nome: ${SEED_ADMIN_NOME:-Administrador}
      SeedAdmin__Email: ${SEED_ADMIN_EMAIL:-admin@local.dev}
      SeedAdmin__Senha: ${SEED_ADMIN_SENHA:?defina SEED_ADMIN_SENHA no arquivo .env}
      # Origens HTTPS: o cookie de refresh é SameSite=Strict e uma origem http:// é outro site
      # (schemeful same-site), então o navegador não o enviaria.
      Cors__AllowedOrigins__0: ${CORS_ORIGIN_1:-https://localhost:4200}
      Cors__AllowedOrigins__1: ${CORS_ORIGIN_2:-https://localhost:4201}
      ReverseProxy__TrustedNetworkCidr: ${API_TRUSTED_PROXY_CIDR:-172.30.0.10/32}
      DataProtection__KeysPath: /var/lib/almirante/dataprotection
    networks:
      - almirante-net
    # Só acessível pela rede interna do Compose (pelo nginx). Não publica porta no host: quem
    # publica para fora é o nginx, para que o rate limit do login não possa ser contornado
    # acessando a API diretamente.
    expose:
      - "8080"
    volumes:
      # Chaves do Data Protection (antiforgery) persistidas entre reinícios/recriações. O diretório é
      # criado na imagem com dono "app" e permissão 700, e um volume novo herda essa posse.
      - almirante-dataprotection:/var/lib/almirante/dataprotection
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: almirante-nginx
    depends_on:
      api:
        condition: service_healthy
    networks:
      almirante-net:
        ipv4_address: ${NGINX_IPV4:-172.30.0.10}
    # 8090 (HTTP) continua atendendo /health e /alive para healthchecks e o workflow de deploy; todo
    # o resto é redirecionado para HTTPS (API_HTTPS_HOST_PORT), onde a API é servida.
    ports:
      - "${API_HOST_PORT:-8090}:80"
      - "${API_HTTPS_HOST_PORT:-8443}:443"
    environment:
      ALMIRANTE_PUBLIC_HTTPS_PORT: ${API_HTTPS_HOST_PORT:-8443}
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/templates/default.conf.template:ro
      # tls.crt e tls.key (PEM), fora do Git. Ver docs/authentication-security.md.
      - ${NGINX_CERTS_DIR:-./nginx/certs}:/etc/nginx/certs:ro
    healthcheck:
      # 127.0.0.1 explícito: "localhost" resolve para ::1 no Alpine e o nginx escuta só IPv4.
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  almirante-sqlserver-data:
    name: ${SQL_DATA_VOLUME:-almirante-sqlserver-data}
  almirante-dataprotection:
    name: ${DATAPROTECTION_VOLUME:-almirante-dataprotection}
