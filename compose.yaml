name: almirante
# (commit de teste: valida TrustServerCertificate/ASPNETCORE_ENVIRONMENT no .env do runner popos-lucas)

# Rede dedicada com subnet fixa: é o que permite ao ASP.NET Core (ReverseProxy__TrustedNetworkCidr,
# ver api.environment abaixo) confiar apenas no nginx para os headers X-Forwarded-For/X-Forwarded-Proto,
# em vez de confiar em qualquer proxy. Se alterar a subnet aqui, ajuste também API_TRUSTED_PROXY_CIDR
# no .env.
networks:
  almirante-net:
    name: almirante-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: almirante-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:?defina SQL_SA_PASSWORD no arquivo .env}
      MSSQL_PID: Developer
    ports:
      - "${SQL_HOST_PORT:-14330}:1433"
    networks:
      - almirante-net
    volumes:
      # Volume nomeado e persistente: pode ser exportado (docker volume + docker run --rm -v ...)
      # e restaurado em outra máquina para compartilhar backups/estado atual do banco.
      - almirante-sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Almirante.Api/Dockerfile
    container_name: almirante-api
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      # TrustServerCertificate padrão False (produção): o SQL Server do container usa certificado
      # autoassinado, então desenvolvimento local precisa definir SQL_TRUST_SERVER_CERTIFICATE=True no
      # .env (ver .env.example). Em Production, True aqui faz a API recusar iniciar
      # (SqlServerConnectionSecurityValidator) em vez de aceitar TLS sem validação de identidade.
      ConnectionStrings__almirante: Server=sqlserver,1433;Database=almirante;User Id=sa;Password=${SQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=${SQL_TRUST_SERVER_CERTIFICATE:-False}
      Jwt__Issuer: ${JWT_ISSUER:-Almirante.Api}
      Jwt__Audience: ${JWT_AUDIENCE:-Almirante.Frontend}
      Jwt__ActiveKeyId: ${JWT_ACTIVE_KEY_ID:-v1}
      Jwt__Keys__v1: ${JWT_KEY_V1:?defina JWT_KEY_V1 Base64 no arquivo .env}
      Jwt__AccessTokenMinutes: ${JWT_ACCESS_TOKEN_MINUTES:-10}
      Jwt__AbsoluteSessionDays: ${AUTH_SESSION_DAYS:-7}
      Jwt__RefreshInactivityHours: ${AUTH_REFRESH_INACTIVITY_HOURS:-24}
      LoginProtection__RateLimit__PermitLimit: ${LOGIN_RATE_LIMIT_PERMITS:-5}
      LoginProtection__RateLimit__WindowSeconds: ${LOGIN_RATE_LIMIT_WINDOW_SECONDS:-60}
      LoginProtection__Lockout__MaxFailedAttempts: ${LOGIN_LOCKOUT_MAX_FAILURES:-10}
      LoginProtection__Lockout__FailureWindowMinutes: ${LOGIN_LOCKOUT_FAILURE_WINDOW_MINUTES:-15}
      LoginProtection__Lockout__LockoutMinutes: ${LOGIN_LOCKOUT_MINUTES:-15}
      SeedAdmin__Nome: ${SEED_ADMIN_NOME:-Administrador}
      SeedAdmin__Email: ${SEED_ADMIN_EMAIL:-admin@local.dev}
      SeedAdmin__Senha: ${SEED_ADMIN_SENHA:?defina SEED_ADMIN_SENHA no arquivo .env}
      Cors__AllowedOrigins__0: ${CORS_ORIGIN_1:-http://localhost:4200}
      Cors__AllowedOrigins__1: ${CORS_ORIGIN_2:-http://localhost:4201}
      ReverseProxy__TrustedNetworkCidr: ${API_TRUSTED_PROXY_CIDR:-172.30.0.0/24}
      DataProtection__KeysPath: /var/lib/almirante/dataprotection
    networks:
      - almirante-net
    # Só acessível pela rede interna do Compose (pelo nginx). Não publica porta no host: quem
    # publica HTTP para fora é o nginx, para que o rate limit do login não possa ser contornado
    # acessando a API diretamente.
    expose:
      - "8080"
    volumes:
      - almirante-dataprotection:/var/lib/almirante/dataprotection
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: almirante-nginx
    depends_on:
      api:
        condition: service_healthy
    networks:
      - almirante-net
    # Único ponto de entrada HTTP externo. Mantém a porta 8090 já usada pelo projeto
    # (documentação, healthchecks e workflows de deploy continuam apontando para ela).
    ports:
      - "${API_HOST_PORT:-8090}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    # 127.0.0.1 (e não localhost): no Alpine "localhost" resolve primeiro para ::1, mas o nginx só
    # escuta IPv4 ("listen 80"), e o healthcheck falhava sempre.
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  almirante-sqlserver-data:
    name: almirante-sqlserver-data
  almirante-dataprotection:
    name: almirante-dataprotection
