name: almirante

# Rede dedicada com subnet fixa: é o que permite ao ASP.NET Core (ReverseProxy__TrustedNetworkCidr,
# ver api.environment abaixo) confiar apenas no nginx para os headers X-Forwarded-For/X-Forwarded-Proto,
# em vez de confiar em qualquer proxy. Se alterar a subnet aqui, ajuste também API_TRUSTED_PROXY_CIDR
# no .env.
networks:
  almirante-net:
    name: almirante-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: almirante-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      # Só este serviço (que inicializa a instância) e o "sql-bootstrap" conhecem o segredo do "sa". A API
      # NUNCA o recebe: não existe SQL_SA_PASSWORD no ambiente dela, e ela recusa iniciar se receber.
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:?defina SQL_SA_PASSWORD no arquivo .env}
      MSSQL_PID: Developer
    # Publicada SÓ no loopback do host. O Docker escreve direto na chain DOCKER do iptables e
    # normalmente contorna o ufw, então "- 14330:1433" expunha o SQL Server (com o login
    # administrativo) na internet do host publicado — furando a premissa de que o nginx é o único
    # ponto de entrada. A API não usa este mapeamento (fala com "sqlserver:1433" pela rede interna);
    # ele existe para ferramentas locais. Para alcançar de outra máquina, use um túnel SSH
    # (ssh -L 14330:127.0.0.1:14330 host) em vez de abrir a porta.
    ports:
      - "${SQL_BIND_ADDRESS:-127.0.0.1}:${SQL_HOST_PORT:-14330}:1433"
    security_opt:
      - no-new-privileges:true
    networks:
      - almirante-net
    volumes:
      # Volume nomeado e persistente: pode ser exportado (docker volume + docker run --rm -v ...)
      # e restaurado em outra máquina para compartilhar backups/estado atual do banco.
      - almirante-sqlserver-data:/var/opt/mssql
    # Readiness SEM autenticação privilegiada (nenhum "sa", nenhuma senha): tenta um login que não existe e
    # exige a resposta "Login failed for user" — a resposta do SQL Server a um login inexistente prova que a
    # instância terminou de subir e está processando autenticações. Servidor ainda subindo, porta fechada ou
    # timeout produzem outra saída e reprovam. (O "sql-bootstrap" confirma depois, com credencial, que aceita
    # comandos; e o /health da API confere a conexão real com a identidade de runtime.) Custo: uma tentativa de
    # login inválida do usuário "almirante_healthcheck" a cada intervalo aparece no log do SQL Server.
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U almirante_healthcheck -P invalido -C -l 5 -Q 'SELECT 1' 2>&1 | grep -q 'Login failed for user' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # Provisionamento PRÉVIO e separado da API: cria o banco e as duas identidades da aplicação (administrativa
  # dedicada e de runtime, ambas usuários contidos do banco, sem nenhum privilégio de servidor) com
  # docs/sql/criar-usuario-admin-app.sql. Roda uma vez por "up", é idempotente e sai; a API só sobe depois
  # de ele terminar com sucesso. É o único serviço, além do sqlserver, com o segredo do "sa" — passado por
  # variável de ambiente lida pelo sqlcmd (SQLCMDPASSWORD), nunca por linha de comando. Rotação da credencial
  # administrativa: troque SQL_ADMIN_PASSWORD no .env e rode "docker compose up -d" (ver
  # docs/authentication-security.md).
  sql-bootstrap:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sqlserver:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/bootstrap/sql-bootstrap.sh"]
    environment:
      SQLCMDPASSWORD: ${SQL_SA_PASSWORD:?defina SQL_SA_PASSWORD no arquivo .env}
      SQL_BOOTSTRAP_HOST: sqlserver
      DB_NAME: almirante
      ADMIN_USER: ${SQL_ADMIN_USER:?defina SQL_ADMIN_USER (identidade administrativa dedicada da API, nunca sa) no arquivo .env}
      APP_USER: ${SQL_APP_USER:-almirante_user_bd}
      APP_ADMIN_PASSWORD: ${SQL_ADMIN_PASSWORD:?defina SQL_ADMIN_PASSWORD (16+ caracteres, diferente da senha do sa) no arquivo .env}
    volumes:
      - type: bind
        source: ./scripts/sql-bootstrap.sh
        target: /bootstrap/sql-bootstrap.sh
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./docs/sql/criar-usuario-admin-app.sql
        target: /bootstrap/criar-usuario-admin-app.sql
        read_only: true
        bind:
          create_host_path: false
    networks:
      - almirante-net
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"

  api:
    build:
      context: ./backend
      dockerfile: Almirante.Api/Dockerfile
    container_name: almirante-api
    depends_on:
      sqlserver:
        condition: service_healthy
      sql-bootstrap:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      # TrustServerCertificate padrão False (produção): o SQL Server do container usa certificado
      # autoassinado, então desenvolvimento local precisa definir SQL_TRUST_SERVER_CERTIFICATE=True no
      # .env (ver .env.example). Em Production, True aqui faz a API recusar iniciar
      # (SqlServerConnectionSecurityValidator) em vez de aceitar TLS sem validação de identidade.
      # Identidade de RUNTIME (menor privilégio): a connection string "almirante" NÃO leva usuário/senha; a
      # API gera uma senha aleatória para DbCredentials__AppUser (só SELECT/INSERT/UPDATE; DELETE só em
      # AuthSessions), a rotaciona e a injeta a cada conexão. Nada disso usa o "sa".
      ConnectionStrings__almirante: Server=sqlserver,1433;Database=almirante;Encrypt=True;TrustServerCertificate=${SQL_TRUST_SERVER_CERTIFICATE:-False}
      # Identidade ADMINISTRATIVA da API (migrations, concessões à role de runtime, rotação da senha de
      # runtime): usuário contido dedicado criado pelo serviço sql-bootstrap, sem nenhum privilégio de
      # servidor. OBRIGATÓRIA e sem valor padrão: não existe fallback para "sa" — variável ausente derruba o
      # "compose up", "sa" é recusado pela própria API (SqlIdentityPolicy) e privilégio além do previsto
      # também (DbPrivilegeAuditor, sempre fatal). O segredo do "sa" (SQL_SA_PASSWORD) não entra aqui.
      ConnectionStrings__AlmiranteAdmin: Server=sqlserver,1433;Database=almirante;User Id=${SQL_ADMIN_USER:?defina SQL_ADMIN_USER (identidade administrativa dedicada da API, nunca sa) no arquivo .env};Password=${SQL_ADMIN_PASSWORD:?defina SQL_ADMIN_PASSWORD no arquivo .env};Encrypt=True;TrustServerCertificate=${SQL_TRUST_SERVER_CERTIFICATE:-False}
      DbCredentials__AppUser: ${SQL_APP_USER:-almirante_user_bd}
      DbCredentials__RotationHours: ${SQL_APP_PASSWORD_ROTATION_HOURS:-24}
      Jwt__Issuer: ${JWT_ISSUER:-Almirante.Api}
      Jwt__Audience: ${JWT_AUDIENCE:-Almirante.Frontend}
      Jwt__ActiveKeyId: ${JWT_ACTIVE_KEY_ID:-v1}
      # Opcionais (não ":?"): durante uma rotação de chave (issue #50), o operador pode definir só
      # JWT_KEY_V1 (padrão), as duas ao mesmo tempo (janela de rotação) ou só JWT_KEY_V2 (rotação
      # concluída) mudando apenas o .env — sem editar este arquivo a cada etapa. Uma entrada não
      # definida chega vazia e é removida antes da validação (ver Program.cs, PostConfigure<JwtOptions>);
      # a aplicação recusa iniciar do mesmo jeito se, ao final, nenhuma chave válida sobrar.
      Jwt__Keys__v1: ${JWT_KEY_V1:-}
      Jwt__Keys__v2: ${JWT_KEY_V2:-}
      Jwt__AccessTokenMinutes: ${JWT_ACCESS_TOKEN_MINUTES:-10}
      Jwt__AbsoluteSessionDays: ${AUTH_SESSION_DAYS:-7}
      Jwt__RefreshInactivityHours: ${AUTH_REFRESH_INACTIVITY_HOURS:-24}
      LoginProtection__RateLimit__PermitLimit: ${LOGIN_RATE_LIMIT_PERMITS:-5}
      LoginProtection__RateLimit__WindowSeconds: ${LOGIN_RATE_LIMIT_WINDOW_SECONDS:-60}
      LoginProtection__Lockout__MaxFailedAttempts: ${LOGIN_LOCKOUT_MAX_FAILURES:-10}
      LoginProtection__Lockout__FailureWindowMinutes: ${LOGIN_LOCKOUT_FAILURE_WINDOW_MINUTES:-15}
      LoginProtection__Lockout__LockoutMinutes: ${LOGIN_LOCKOUT_MINUTES:-15}
      SeedAdmin__Nome: ${SEED_ADMIN_NOME:-Administrador}
      SeedAdmin__Email: ${SEED_ADMIN_EMAIL:-admin@local.dev}
      SeedAdmin__Senha: ${SEED_ADMIN_SENHA:?defina SEED_ADMIN_SENHA no arquivo .env}
      Cors__AllowedOrigins__0: ${CORS_ORIGIN_1:-http://localhost:4200}
      Cors__AllowedOrigins__1: ${CORS_ORIGIN_2:-http://localhost:4201}
      ReverseProxy__TrustedNetworkCidr: ${API_TRUSTED_PROXY_CIDR:-172.30.0.0/24}
      DataProtection__KeysPath: /var/lib/almirante/dataprotection
      # Host Header: o padrão "*" aceita qualquer Host, porque este arquivo também serve
      # desenvolvimento local (localhost, 127.0.0.1, IP da LAN) e fixar a lista quebraria isso.
      # Em ambiente PUBLICADO em modo http, defina API_ALLOWED_HOSTS no .env com os nomes reais
      # (ex.: "api.exemplo.com.br;localhost;127.0.0.1") — o deploy avisa no log enquanto estiver "*".
      # No overlay TLS, compose.tls.yaml já fixa a lista a partir de TLS_PUBLIC_HOST.
      AllowedHosts: ${API_ALLOWED_HOSTS:-*}
      # Swagger/OpenAPI expõem o mapa completo da API (rotas, DTOs, parâmetros). Fora de Development
      # fica desligado por padrão; ligue conscientemente com SWAGGER_ENABLED=true se precisar.
      Swagger__Enabled: ${SWAGGER_ENABLED:-}
    networks:
      - almirante-net
    # Só acessível pela rede interna do Compose (pelo nginx). Não publica porta no host: quem
    # publica HTTP para fora é o nginx, para que o rate limit do login não possa ser contornado
    # acessando a API diretamente.
    expose:
      - "8080"
    # A API roda como usuário "app" (não-root, ver Dockerfile) e escuta em 8080, porta não
    # privilegiada: não precisa de nenhuma capability do Linux. cap_drop ALL reduz o que um
    # comprometimento do processo alcança; no-new-privileges impede ganho por binário setuid.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - almirante-dataprotection:/var/lib/almirante/dataprotection
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: almirante-nginx
    depends_on:
      api:
        condition: service_healthy
    networks:
      - almirante-net
    # Único ponto de entrada HTTP externo. Mantém a porta 8090 já usada pelo projeto
    # (documentação, healthchecks e workflows de deploy continuam apontando para ela).
    ports:
      - "${API_HOST_PORT:-8090}:80"
    # Sem cap_drop aqui de propósito: o modelo master/worker do nginx precisa de CHOWN/SETUID/SETGID
    # (e NET_BIND_SERVICE na 80) para baixar privilégio dos workers. no-new-privileges é seguro e
    # mantém o ganho principal.
    security_opt:
      - no-new-privileges:true
    volumes:
      # NGINX_CONF_FILE (padrão nginx.conf) troca para nginx.tls.conf em ambientes publicados com TLS
      # real (ver compose.tls.yaml e docs/authentication-security.md); não altera o comportamento
      # padrão de quem não define essa variável.
      - ./nginx/${NGINX_CONF_FILE:-nginx.conf}:/etc/nginx/conf.d/default.conf:ro
    # 127.0.0.1 (e não localhost): no Alpine "localhost" resolve primeiro para ::1, mas o nginx só
    # escuta IPv4 ("listen 80"), e o healthcheck falhava sempre.
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  almirante-sqlserver-data:
    name: almirante-sqlserver-data
  almirante-dataprotection:
    name: almirante-dataprotection
