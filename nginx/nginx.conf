# Reverse proxy da API Almirante, com rate limit no endpoint de login.
#
# Fluxo: cliente -> nginx (este arquivo) -> api:8080 (rede interna do Docker Compose).
# A API não é mais publicada diretamente no host; só o nginx expõe HTTP (ver compose.yaml).
#
# Este arquivo é montado em /etc/nginx/conf.d/default.conf, já dentro do bloco "http" do
# nginx.conf padrão da imagem oficial — por isso pode declarar "limit_req_zone" (contexto http)
# diretamente aqui, sem precisar de um bloco "http { ... }" próprio.
#
# Rate limit do login (requisito: até 3 tentativas imediatas por IP a cada 60s, 4ª = 429):
#   - "login_zone": chave = IP real da conexão TCP recebida pelo nginx ($binary_remote_addr).
#     Não depende de nenhum header enviado pelo cliente, logo não pode ser burlado por spoofing.
#   - rate=3r/m = 3 requisições por minuto; burst=2 (no location de login, abaixo) soma-se à
#     1ª requisição "padrão" da zona, liberando as 3 primeiras tentativas de uma vez.
#   - nodelay evita atraso artificial nessas 3 primeiras tentativas (sem isso, o nginx enfileira
#     as requisições em excesso em vez de rejeitá-las na hora).
#   - Passadas as 3 tentativas, a 4ª na mesma janela recebe 429 imediatamente. O "excesso" da
#     zona decai à mesma taxa (3 por minuto), então ~60s após a última tentativa o IP volta a
#     ter as 3 tentativas disponíveis novamente.
#   - Para alterar o limite/janela: ajuste "rate" aqui E "burst" no location de login abaixo
#     (ex.: rate=6r/m + burst=5 => 6 tentativas por minuto).
limit_req_zone $binary_remote_addr zone=login_zone:10m rate=3r/m;
limit_req_zone $binary_remote_addr zone=refresh_zone:10m rate=30r/m;

upstream almirante_api {
    server api:8080;
}

server {
    listen 80;
    server_name _;

    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # Defesa em profundidade: a própria API também limita o login por IP (LoginProtection:RateLimit)
    # e bloqueia a conta após falhas consecutivas; este limite do nginx é por proxy.
    #
    # Headers padrão de reverse proxy, para a API recuperar o IP/host/protocolo originais
    # (consumidos pelo ForwardedHeadersMiddleware do ASP.NET Core — ver Program.cs).
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Único endpoint sujeito a rate limit. Regex case-insensitive (~*) para cobrir variações de
    # caixa (/api/Auth/login, /api/auth/login, ...) e impedir bypass do limite só por diferença
    # de maiúsculas/minúsculas na URL — o roteamento do ASP.NET Core é case-insensitive, então
    # sem isso essas variações passariam direto pelo location "/" abaixo, sem limite.
    location ~* ^/api/auth/login/?$ {
        limit_req zone=login_zone burst=2 nodelay;
        limit_req_status 429;

        error_page 429 = @login_rate_limited;

        proxy_pass http://almirante_api;
    }

    location ~* ^/api/auth/refresh/?$ {
        limit_req zone=refresh_zone burst=9 nodelay;
        limit_req_status 429;
        proxy_pass http://almirante_api;
    }

    # Resposta de 429 coerente com o padrão Problem Details já usado pela API.
    # Retry-After só é enviado aqui — nunca em respostas normais (200, 401 etc.).
    location @login_rate_limited {
        default_type "application/problem+json";
        add_header Retry-After "60" always;
        # Esta resposta é gerada pelo nginx (não passa pela API), então recebe aqui os mesmos
        # cabeçalhos de segurança que a API aplica às próprias respostas. Não os adicione em
        # "server"/"location /": a API já os emite e o nginx os duplicaria.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
        add_header Cache-Control "no-store" always;
        return 429 '{"title":"Muitas tentativas de login.","status":429,"detail":"Aguarde antes de tentar realizar o login novamente."}';
    }

    # Todo o restante do tráfego (demais endpoints da API, Swagger, /health, /alive) segue sem
    # rate limit específico.
    location / {
        proxy_pass http://almirante_api;
    }
}
