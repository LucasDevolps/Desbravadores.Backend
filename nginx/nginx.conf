# Reverse proxy da API Almirante: terminação TLS, rate limit do login/refresh e encaminhamento do
# IP/esquema reais.
#
# Fluxo: cliente -HTTPS-> nginx (este arquivo) -HTTP-> api:8080 (rede interna do Docker Compose).
# A API não é publicada no host; só o nginx expõe portas (ver compose.yaml).
#
# Este arquivo é montado como TEMPLATE em /etc/nginx/templates/default.conf.template: o entrypoint da
# imagem oficial substitui ${ALMIRANTE_PUBLIC_HTTPS_PORT} (definida no compose) e grava o resultado em
# /etc/nginx/conf.d/default.conf, dentro do bloco "http" do nginx.conf padrão. Só variáveis de
# ambiente definidas são substituídas; variáveis do nginx ($host, $remote_addr...) ficam intactas.
#
# Por que TLS aqui: os cookies de autenticação são __Host- + Secure e a API recusa (400) login,
# refresh e logout fora de HTTPS. O nginx informa o esquema real com X-Forwarded-Proto, aceito pela
# API apenas deste container (ReverseProxy:TrustedNetworkCidr = IP fixo do nginx). Certificado e
# chave vêm de ${NGINX_CERTS_DIR} (tls.crt/tls.key), fora do Git — ver docs/authentication-security.md.
#
# Rate limit (chave = IP da conexão TCP recebida pelo nginx, não um header do cliente):
#   - login: 3 tentativas imediatas por IP a cada 60s (rate=3r/m + burst=2 + nodelay); a 4ª = 429.
#   - refresh: 30/min com burst 9, suficiente para renovações legítimas (access token de 10 min).
#   - Preflight CORS (OPTIONS) NÃO conta: sem isso cada login de navegador gastaria 2 das 3 tentativas.
#     Chave vazia faz o limit_req ignorar a requisição.
#   - O contador é local a cada instância do nginx; com vários proxies o limite efetivo é por proxy.
map $request_method $login_limit_key {
    OPTIONS "";
    default $binary_remote_addr;
}

map $request_method $refresh_limit_key {
    OPTIONS "";
    default $binary_remote_addr;
}

limit_req_zone $login_limit_key zone=login_zone:10m rate=3r/m;
limit_req_zone $refresh_limit_key zone=refresh_zone:10m rate=30r/m;

upstream almirante_api {
    server api:8080;
    # Reaproveita conexões com a API. Sem isso (mesmo com proxy_http_version 1.1 e Connection "") o
    # nginx fecha cada conexão e esgota portas efêmeras sob carga (connect() failed (99) -> 502).
    keepalive 32;
}

# HTTP: apenas health checks internos (compose, workflow de deploy) e redirecionamento para HTTPS.
server {
    listen 80;
    server_name _;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;

    location = /health {
        proxy_pass http://almirante_api;
    }

    location = /alive {
        proxy_pass http://almirante_api;
    }

    location / {
        return 308 https://$host:${ALMIRANTE_PUBLIC_HTTPS_PORT}$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:almirante_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # Headers padrão de reverse proxy, consumidos pelo ForwardedHeadersMiddleware (Program.cs). O
    # esquema é fixo em https: este server só atende TLS, e um X-Forwarded-Proto vindo do cliente é
    # sobrescrito aqui.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    # Regex case-insensitive (~*): o roteamento do ASP.NET Core não diferencia caixa, então variações
    # como /api/auth/LOGIN não podem escapar do limite.
    location ~* ^/api/auth/login/?$ {
        limit_req zone=login_zone burst=2 nodelay;
        limit_req_status 429;
        error_page 429 = @login_rate_limited;
        proxy_pass http://almirante_api;
    }

    location ~* ^/api/auth/refresh/?$ {
        limit_req zone=refresh_zone burst=9 nodelay;
        limit_req_status 429;
        error_page 429 = @refresh_rate_limited;
        proxy_pass http://almirante_api;
    }

    # Respostas 429 no formato Problem Details usado pela API. Retry-After só é enviado aqui.
    location @login_rate_limited {
        default_type "application/problem+json";
        add_header Retry-After "60" always;
        add_header Cache-Control "no-store" always;
        return 429 '{"title":"Muitas tentativas de login.","status":429,"detail":"Aguarde antes de tentar realizar o login novamente."}';
    }

    location @refresh_rate_limited {
        default_type "application/problem+json";
        add_header Retry-After "10" always;
        add_header Cache-Control "no-store" always;
        return 429 '{"title":"Muitas renovações de sessão.","status":429,"detail":"Aguarde antes de renovar a sessão novamente."}';
    }

    # Demais endpoints da API, Swagger, /health e /alive, sem rate limit específico.
    location / {
        proxy_pass http://almirante_api;
    }
}
