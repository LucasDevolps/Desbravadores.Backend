# Reverse proxy da API Almirante para o deploy Windows/IIS (self-hosted runner), com a mesma
# terminação TLS e os mesmos rate limits do Docker Compose (ver nginx/nginx.conf, a versão
# Linux/container deste arquivo).
#
# Fluxo: cliente -HTTPS-> nginx (127.0.0.1:8443) -HTTP-> IIS (127.0.0.1:__IIS_PORT__, loopback).
#        127.0.0.1:8090 (HTTP) só atende /health e /alive e redireciona o resto para HTTPS.
#
# __IIS_PORT__ é substituído pelo workflow de deploy (.github/workflows/backend-deploy.yml, job
# deploy-windows) pela porta que o IIS usa de fato no momento do deploy.
#
# O certificado (C:/nginx/certs/almirante.crt|.key) é gerado pelo workflow como autoassinado quando
# ainda não existe. Para uso além desta máquina, substitua-o por um certificado confiável.
#
# Diferente do Linux, o nginx aqui roda nativo (sem Docker) e só escuta em 127.0.0.1: este deploy
# Windows é só para uso local/rede interna. Ajuste os "listen" abaixo se este site passar a precisar
# ser alcançado por outras máquinas da rede.
map $request_method $login_limit_key_win {
    OPTIONS "";
    default $binary_remote_addr;
}

map $request_method $refresh_limit_key_win {
    OPTIONS "";
    default $binary_remote_addr;
}

limit_req_zone $login_limit_key_win zone=login_zone_win:10m rate=3r/m;
limit_req_zone $refresh_limit_key_win zone=refresh_zone_win:10m rate=30r/m;

upstream almirante_api_windows {
    server 127.0.0.1:__IIS_PORT__;
    keepalive 32;
}

server {
    listen 127.0.0.1:8090;
    server_name _;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;

    location = /health {
        proxy_pass http://almirante_api_windows;
    }

    location = /alive {
        proxy_pass http://almirante_api_windows;
    }

    location / {
        return 308 https://$host:8443$request_uri;
    }
}

server {
    listen 127.0.0.1:8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate C:/nginx/certs/almirante.crt;
    ssl_certificate_key C:/nginx/certs/almirante.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:almirante_ssl_win:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    location ~* ^/api/auth/login/?$ {
        limit_req zone=login_zone_win burst=2 nodelay;
        limit_req_status 429;
        error_page 429 = @login_rate_limited;
        proxy_pass http://almirante_api_windows;
    }

    location ~* ^/api/auth/refresh/?$ {
        limit_req zone=refresh_zone_win burst=9 nodelay;
        limit_req_status 429;
        error_page 429 = @refresh_rate_limited;
        proxy_pass http://almirante_api_windows;
    }

    location @login_rate_limited {
        default_type "application/problem+json";
        add_header Retry-After "60" always;
        add_header Cache-Control "no-store" always;
        return 429 '{"title":"Muitas tentativas de login.","status":429,"detail":"Aguarde antes de tentar realizar o login novamente."}';
    }

    location @refresh_rate_limited {
        default_type "application/problem+json";
        add_header Retry-After "10" always;
        add_header Cache-Control "no-store" always;
        return 429 '{"title":"Muitas renovações de sessão.","status":429,"detail":"Aguarde antes de renovar a sessão novamente."}';
    }

    location / {
        proxy_pass http://almirante_api_windows;
    }
}
