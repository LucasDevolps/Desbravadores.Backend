# Reverse proxy da API Almirante para o deploy Windows/IIS (self-hosted runner), com o
# mesmo rate limit de login usado no Docker Compose (ver nginx/nginx.conf, que é a versão
# Linux/container deste mesmo arquivo).
#
# Fluxo: cliente -> nginx (127.0.0.1:8090) -> IIS (127.0.0.1:__IIS_PORT__, loopback).
#
# __IIS_PORT__ é substituído pelo workflow de deploy (.github/workflows/backend-deploy.yml,
# job deploy-windows) pela porta que o IIS está usando de fato no momento do deploy (descoberta
# dinamicamente via WebAdministration, porque essa porta já mudou entre deploys no passado).
#
# Diferente do Linux, o nginx aqui roda nativo (sem Docker) e só escuta em 127.0.0.1: este
# deploy Windows é só para uso local/rede interna, nunca foi exposto à internet (o deploy
# público de verdade é o Linux via Docker Compose). Ajuste o "listen" abaixo se este site
# passar a precisar ser alcançado por outras máquinas da rede.
limit_req_zone $binary_remote_addr zone=login_zone_win:10m rate=3r/m;
limit_req_zone $binary_remote_addr zone=refresh_zone_win:10m rate=30r/m;

# Hub SignalR de notificações (issue #130): upgrade WebSocket e access log sem query; ver nginx.conf.
# O IIS também precisa do recurso "WebSocket Protocol"; sem ele o cliente cai para long polling.
map $http_upgrade $almirante_connection_upgrade_win {
    default upgrade;
    ''      '';
}

log_format almirante_hub_win '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                             '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

upstream almirante_api_windows {
    server 127.0.0.1:__IIS_PORT__;
}

server {
    listen 127.0.0.1:8090;
    server_name _;

    proxy_http_version 1.1;
    proxy_set_header Connection "";

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location ~* ^/api/auth/login/?$ {
        limit_req zone=login_zone_win burst=2 nodelay;
        limit_req_status 429;

        error_page 429 = @login_rate_limited;

        proxy_pass http://almirante_api_windows;
    }

    location ~* ^/api/auth/refresh/?$ {
        limit_req zone=refresh_zone_win burst=9 nodelay;
        limit_req_status 429;

        error_page 429 = @refresh_rate_limited;

        proxy_pass http://almirante_api_windows;
    }

    location @refresh_rate_limited {
        default_type "application/problem+json";
        add_header Retry-After "60" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
        add_header Cache-Control "no-store" always;
        return 429 '{"title":"Muitas renovações de sessão.","status":429,"detail":"Aguarde antes de renovar a sessão novamente."}';
    }

    location @login_rate_limited {
        default_type "application/problem+json";
        add_header Retry-After "60" always;
        # Esta resposta é gerada pelo nginx (não passa pela API), então recebe aqui os mesmos
        # cabeçalhos de segurança que a API aplica às próprias respostas. Não os adicione em
        # "server"/"location /": a API já os emite e o nginx os duplicaria.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
        add_header Cache-Control "no-store" always;
        return 429 '{"title":"Muitas tentativas de login.","status":429,"detail":"Aguarde antes de tentar realizar o login novamente."}';
    }

    # Foto de perfil (issue #116): único lugar com corpo grande; ver nginx.conf.
    location ~* "^/api/usuarios/[0-9a-f-]{36}/foto/?$" {
        client_max_body_size 11m;
        error_page 413 = @foto_grande_demais;
        proxy_pass http://almirante_api_windows;
    }

    location @foto_grande_demais {
        default_type "application/problem+json";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
        add_header Cache-Control "no-store" always;
        return 413 '{"title":"Foto grande demais.","status":413,"detail":"A foto deve ter no máximo 10 MB."}';
    }

    # Hub SignalR: headers repetidos (proxy_set_header aqui substitui os herdados), upgrade WebSocket,
    # timeouts e logs sem token; ver nginx.conf. Caminhos de log relativos ao prefixo do nginx (C:\nginx).
    location ~* ^/hubs/notificacoes(/.*)?$ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $almirante_connection_upgrade_win;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
        proxy_cache off;
        access_log logs/access.log almirante_hub_win;
        error_log logs/error.log crit;
        proxy_pass http://almirante_api_windows;
    }

    location / {
        proxy_pass http://almirante_api_windows;
    }
}
