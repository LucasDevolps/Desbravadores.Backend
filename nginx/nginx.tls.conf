# Reverse proxy da API Almirante para ambientes PUBLICADOS com TLS real (certificado emitido por uma
# CA, ex.: Let's Encrypt, ou fornecido pela infraestrutura responsável pelo domínio).
#
# Diferente de nginx.conf (desenvolvimento local, HTTP e HTTPS convivendo no mesmo listener para
# facilitar testes sem certificado — ver compose.https.yaml/docs/local-login.md), este arquivo assume
# que a porta pública 80 NUNCA deve servir conteúdo: ela só existe para redirecionar (308) o cliente a
# HTTPS. Por isso são dois "server" separados, e não um "include" dentro do mesmo bloco.
#
# Ativação (opt-in; não é o padrão do compose.yaml): defina no .env do ambiente publicado
#   NGINX_CONF_FILE=nginx.tls.conf
#   TLS_PUBLIC_HOST=api.exemplo.com.br          (nome DNS do certificado; é o ÚNICO host aceito)
#   TLS_CERT_PATH=/caminho/para/fullchain.pem   (fora do Git; ver docs/authentication-security.md)
#   TLS_KEY_PATH=/caminho/para/privkey.pem      (fora do Git; permissão restrita no host)
# gere o arquivo de host (uma vez por mudança de TLS_PUBLIC_HOST; o workflow de deploy já faz isso):
#   scripts/deploy-config.sh gerar-host-tls nginx/generated/tls-host.conf "$TLS_PUBLIC_HOST"
# e suba com o overlay compose.tls.yaml:
#   docker compose -f compose.yaml -f compose.tls.yaml up -d --build
#
# Fluxo: cliente -> nginx:80 (redirect 308) / nginx:443 (TLS) -> api:8080 (rede interna do Compose).
# A API continua sem publicar porta própria no host (ver compose.yaml "expose").
#
# Host Header: só o nome de TLS_PUBLIC_HOST é aceito ($almirante_host_ok, definido em tls-host.conf,
# gerado a partir da configuração). Host desconhecido recebe 421 e NUNCA é refletido: o redirect
# HTTP->HTTPS usa sempre o destino canônico ($almirante_canonical_host), preservando caminho e query, e
# a API recebe sempre o host canônico.
include /etc/nginx/almirante-host/host.conf;

limit_req_zone $binary_remote_addr zone=login_zone_tls:10m rate=3r/m;
limit_req_zone $binary_remote_addr zone=refresh_zone_tls:10m rate=30r/m;

upstream almirante_api_tls {
    server api:8080;
}

# HTTP público: somente redireciona para HTTPS. 308 (e não 301/302) preserva o método e o corpo da
# requisição original — importante porque os clientes desta API fazem POST/PUT/DELETE, não só GET.
server {
    listen 80;
    server_name _;

    # Diagnóstico interno do healthcheck do Compose (compose.tls.yaml) — nunca alcançável de
    # fora (allow 127.0.0.1; deny all). Existe porque o healthcheck, rodando dentro do próprio
    # container, não pode seguir o redirect 308 abaixo: o certificado é emitido para o domínio
    # público, não para "127.0.0.1", e a verificação de identidade do certificado falharia. A
    # porta pública 80 continua sem servir nada além do redirect para qualquer outro caminho.
    location = /internal-health {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://almirante_api_tls/health;
    }

    location / {
        if ($almirante_host_ok = 0) {
            return 421;
        }
        return 308 https://$almirante_canonical_host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name _;

    # Caminhos fixos dentro do container; o que muda por ambiente é o que compose.tls.yaml monta
    # nesses caminhos (TLS_CERT_PATH/TLS_KEY_PATH do .env), nunca este arquivo.
    ssl_certificate     /etc/nginx/tls-certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls-certs/privkey.pem;

    if ($almirante_host_ok = 0) {
        return 421;
    }

    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # Mesmos headers de nginx.conf: a API só confia neles vindos desta rede Docker
    # (ReverseProxy__TrustedNetworkCidr / API_TRUSTED_PROXY_CIDR) — ver Program.cs. O Host enviado à
    # API é sempre o canônico, nunca o valor bruto do cliente.
    proxy_set_header Host $almirante_canonical_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # O diagnóstico interno existe só na porta 80 (loopback); por aqui nunca chega à API.
    location = /internal-health {
        return 404;
    }

    location ~* ^/api/auth/login/?$ {
        limit_req zone=login_zone_tls burst=2 nodelay;
        limit_req_status 429;

        error_page 429 = @login_rate_limited;

        proxy_pass http://almirante_api_tls;
    }

    location ~* ^/api/auth/refresh/?$ {
        limit_req zone=refresh_zone_tls burst=9 nodelay;
        limit_req_status 429;

        error_page 429 = @refresh_rate_limited;

        proxy_pass http://almirante_api_tls;
    }

    # Respostas 429 geradas pelo nginx (não passam pela API): mesmo formato (problem+json), Retry-After
    # e os mesmos cabeçalhos de segurança que a API aplica às próprias respostas — inclusive HSTS, que
    # aqui é emitido só por serem respostas do proxy (as da API já trazem o HSTS da própria API; não
    # os adicione em "server"/"location /" para não duplicar).
    location @login_rate_limited {
        default_type "application/problem+json";
        add_header Retry-After "60" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
        add_header Cache-Control "no-store" always;
        return 429 '{"title":"Muitas tentativas de login.","status":429,"detail":"Aguarde antes de tentar realizar o login novamente."}';
    }

    location @refresh_rate_limited {
        default_type "application/problem+json";
        add_header Retry-After "60" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
        add_header Cache-Control "no-store" always;
        return 429 '{"title":"Muitas renovações de sessão.","status":429,"detail":"Aguarde antes de renovar a sessão novamente."}';
    }

    location / {
        proxy_pass http://almirante_api_tls;
    }
}
